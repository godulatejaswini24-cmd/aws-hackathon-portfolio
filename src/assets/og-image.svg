<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0A0E17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="600" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#FF9900"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="150" r="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="rgba(56, 189, 248, 0.15)"/>
      <stop offset="1" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="20" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Cloud Vector Graphic -->
  <g transform="translate(100, 110)">
    <rect width="72" height="72" rx="16" fill="rgba(56, 189, 248, 0.1)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>
    <path d="M49 46H29a12 12 0 1 1 11.5-15.4A8 8 0 0 1 49 46Z" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AWS Badge -->
  <g transform="translate(190, 126)">
    <rect width="170" height="40" rx="20" fill="rgba(255, 153, 0, 0.15)" stroke="rgba(255, 153, 0, 0.4)" stroke-width="1.5"/>
    <text x="85" y="25" fill="#FF9900" font-family="'Space Grotesk', system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">AWS HACKATHON</text>
  </g>

  <!-- Title -->
  <text x="100" y="260" fill="#F8FAFC" font-family="'Space Grotesk', system-ui, sans-serif" font-size="64" font-weight="bold" letter-spacing="-1.5">
    Alex Rivera
  </text>
  <text x="100" y="325" fill="url(#accentGrad)" font-family="'Space Grotesk', system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="-0.5">
    Cloud Architect &amp; Full-Stack Engineer
  </text>

  <!-- Description -->
  <text x="100" y="390" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400">
    Architecting resilient, serverless solutions on AWS (S3, CloudFront, Lambda, DynamoDB).
  </text>
  <text x="100" y="425" fill="#94A3B8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="400">
    Featuring an Interactive Cloud Terminal with personal facts, skills, and secret Easter eggs.
  </text>

  <!-- Footer Tags -->
  <g transform="translate(100, 490)">
    <rect width="180" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="90" y="26" fill="#38BDF8" font-family="'Space Grotesk', monospace" font-size="14" text-anchor="middle">⚡ Serverless &amp; Edge</text>

    <rect x="200" width="180" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="290" y="26" fill="#10B981" font-family="'Space Grotesk', monospace" font-size="14" text-anchor="middle">☁️ S3 + CloudFront</text>

    <rect x="400" width="180" height="42" rx="10" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
    <text x="490" y="26" fill="#F59E0B" font-family="'Space Grotesk', monospace" font-size="14" text-anchor="middle">&gt;_ Interactive CLI</text>
  </g>
</svg>
